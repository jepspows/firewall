<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firewall — Live Attack Dashboard</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --text: #e4e4e7;
    --muted: #71717a;
    --accent: #ff5c01;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
    --blue: #3b82f6;
    --purple: #8b5cf6;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; }
  header .logo span { color: var(--accent); }
  header .status { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    animation: pulse 2s infinite;
  }
  .status-dot.online { background: var(--green); }
  .status-dot.offline { background: var(--red); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 24px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; text-align: center; transition: transform 0.2s;
  }
  .stat-card:hover { transform: translateY(-2px); }
  .stat-card .label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
  .stat-card .value { font-size: 2rem; font-weight: 800; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .stat-card .value.green { color: var(--green); }
  .stat-card .value.red { color: var(--red); }
  .stat-card .value.accent { color: var(--accent); }
  .stat-card .value.blue { color: var(--blue); }

  .panels { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; margin-bottom: 24px; }
  @media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
  }
  .panel-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-body { padding: 16px; }

  /* Live feed */
  .live-feed { max-height: 400px; overflow-y: auto; }
  .live-feed .entry {
    padding: 10px 14px; border-left: 3px solid var(--border); margin-bottom: 8px;
    background: rgba(255,255,255,0.02); border-radius: 0 6px 6px 0;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
  .live-feed .entry.blocked { border-left-color: var(--red); }
  .live-feed .entry.allowed { border-left-color: var(--green); }
  .live-feed .entry .ts { font-size: 0.65rem; color: var(--muted); }
  .live-feed .entry .prompt { font-size: 0.8rem; margin: 4px 0; word-break: break-all; color: var(--text); }
  .live-feed .entry .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .live-feed .entry .tag {
    font-size: 0.6rem; padding: 2px 8px; border-radius: 4px;
    text-transform: uppercase; letter-spacing: 0.5px;
    background: rgba(255,92,1,0.15); color: var(--accent);
  }
  .live-feed .entry .tag.green { background: rgba(34,197,94,0.15); color: var(--green); }
  .live-feed .entry .tag.red { background: rgba(239,68,68,0.15); color: var(--red); }

  /* Chart bars */
  .bar-chart { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: flex; align-items: center; gap: 10px; }
  .bar-label { width: 130px; font-size: 0.75rem; text-align: right; flex-shrink: 0; color: var(--muted); }
  .bar-track { flex: 1; background: var(--border); border-radius: 5px; height: 24px; overflow: hidden; position: relative; }
  .bar-fill { height: 100%; border-radius: 5px; display: flex; align-items: center; padding-left: 10px; font-size: 0.7rem; font-weight: 600; transition: width 0.5s ease; }
  .bar-fill.green { background: linear-gradient(90deg, #16a34a, #22c55e); }
  .bar-fill.red { background: linear-gradient(90deg, #dc2626, #ef4444); }
  .bar-fill.orange { background: linear-gradient(90deg, #ea580c, #f97316); }
  .bar-fill.purple { background: linear-gradient(90deg, #7c3aed, #8b5cf6); }
  .bar-fill.blue { background: linear-gradient(90deg, #2563eb, #3b82f6); }
  .bar-fill.yellow { background: linear-gradient(90deg, #ca8a04, #eab308); }

  /* Block ratio gauge */
  .gauge { position: relative; width: 160px; height: 160px; margin: 0 auto; }
  .gauge svg { transform: rotate(-90deg); }
  .gauge .bg { fill: none; stroke: var(--border); stroke-width: 12; }
  .gauge .fg { fill: none; stroke: var(--green); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 1s ease, stroke 0.5s; }
  .gauge .center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; }
  .gauge .center .pct { font-size: 1.8rem; font-weight: 800; }
  .gauge .center .lbl { font-size: 0.65rem; color: var(--muted); }

  /* Empty state */
  .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 0.9rem; }
</style>
</head>
<body>

<header>
  <div class="logo">fire<span>wall</span> — Live Attack Dashboard</div>
  <div class="status">
    <div class="status-dot offline" id="status-dot"></div>
    <span id="status-text">Connecting...</span>
  </div>
</header>

<div class="container">
  <!-- Stats Grid -->
  <div class="grid" id="stats-grid">
    <div class="stat-card"><div class="label">Total Processed</div><div class="value accent" id="s-total">0</div></div>
    <div class="stat-card"><div class="label">Allowed</div><div class="value green" id="s-allowed">0</div></div>
    <div class="stat-card"><div class="label">Blocked</div><div class="value red" id="s-blocked">0</div></div>
    <div class="stat-card"><div class="label">Block Rate</div><div class="value blue" id="s-rate">0%</div></div>
    <div class="stat-card"><div class="label">Avg Latency</div><div class="value accent" id="s-latency">0ms</div></div>
    <div class="stat-card"><div class="label">Active WS</div><div class="value blue" id="s-active">0</div></div>
  </div>

  <div class="panels">
    <!-- Live Attack Feed -->
    <div class="panel">
      <div class="panel-header">
        <span>Live Attack Feed</span>
        <span style="font-size:0.7rem" id="feed-count">0 events</span>
      </div>
      <div class="live-feed" id="live-feed">
        <div class="empty">Waiting for events...</div>
      </div>
    </div>

    <!-- Category Breakdown -->
    <div class="panel">
      <div class="panel-header">Detection Categories</div>
      <div class="panel-body">
        <div class="bar-chart" id="category-chart">
          <div class="empty">No detections yet</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Block Ratio Gauge -->
  <div class="panel" style="margin-bottom:24px">
    <div class="panel-header">Block / Allow Ratio</div>
    <div class="panel-body" style="display:flex;align-items:center;justify-content:center;gap:40px;flex-wrap:wrap">
      <div class="gauge">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle class="bg" cx="80" cy="80" r="70"/>
          <circle class="fg" id="gauge-fg" cx="80" cy="80" r="70" stroke-dasharray="440" stroke-dashoffset="440"/>
        </svg>
        <div class="center">
          <div class="pct" id="gauge-pct">0%</div>
          <div class="lbl">block rate</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:14px;height:14px;background:var(--green);border-radius:3px"></div>
          <span style="font-size:0.85rem">Allowed: <strong id="g-allowed">0</strong> (<span id="g-allowed-pct">0%</span>)</span>
        </div>
        <div style="display:flex;align-items:center;gap:8px">
          <div style="width:14px;height:14px;background:var(--red);border-radius:3px"></div>
          <span style="font-size:0.85rem">Blocked: <strong id="g-blocked">0</strong> (<span id="g-blocked-pct">0%</span>)</span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const WS_URL = `ws://${location.hostname}:8787/ws/dashboard`;
let ws = null;
let stats = { total: 0, allowed: 0, blocked: 0, latency: 0, active: 0 };
let categories = {};
let events = [];
const MAX_EVENTS = 50;
const CAT_COLORS = ['green','red','orange','purple','blue','yellow'];

function connect() {
  ws = new WebSocket(WS_URL);
  ws.onopen = () => {
    document.getElementById('status-dot').className = 'status-dot online';
    document.getElementById('status-text').textContent = 'Live';
  };
  ws.onclose = () => {
    document.getElementById('status-dot').className = 'status-dot offline';
    document.getElementById('status-text').textContent = 'Reconnecting...';
    setTimeout(connect, 3000);
  };
  ws.onerror = () => ws.close();
  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'connected') return;
      if (msg.type === 'pong') return;
      handleEvent(msg);
    } catch(ex) {}
  };
}

function handleEvent(msg) {
  if (msg.type === 'attack') {
    events.unshift(msg);
    if (events.length > MAX_EVENTS) events.pop();
    stats.total++;
    if (msg.verdict === 'block') stats.blocked++;
    else stats.allowed++;

    if (msg.latency_ms) {
      stats.latency = (stats.latency * (stats.total-1) + msg.latency_ms) / stats.total;
    }
    if (msg.categories) {
      msg.categories.forEach(c => categories[c] = (categories[c]||0)+1);
    }
  } else if (msg.type === 'stats') {
    stats.total = msg.total_checked || 0;
    stats.allowed = msg.total_allowed || 0;
    stats.blocked = msg.total_blocked || 0;
    stats.latency = msg.avg_latency_ms || 0;
    categories = msg.detections_by_category || {};
  }
  stats.active = msg.active_ws || events.length;
  render();
}

function render() {
  document.getElementById('s-total').textContent = stats.total.toLocaleString();
  document.getElementById('s-allowed').textContent = stats.allowed.toLocaleString();
  document.getElementById('s-blocked').textContent = stats.blocked.toLocaleString();
  const rate = stats.total > 0 ? (stats.blocked / stats.total * 100) : 0;
  document.getElementById('s-rate').textContent = rate.toFixed(1) + '%';
  document.getElementById('s-latency').textContent = stats.latency.toFixed(2) + 'ms';
  document.getElementById('s-active').textContent = stats.active;

  // Gauge
  document.getElementById('gauge-pct').textContent = rate.toFixed(1) + '%';
  const offset = 440 - (440 * rate / 100);
  document.getElementById('gauge-fg').setAttribute('stroke-dashoffset', offset);
  document.getElementById('gauge-fg').setAttribute('stroke', rate > 10 ? 'var(--red)' : 'var(--green)');
  document.getElementById('g-allowed').textContent = stats.allowed.toLocaleString();
  document.getElementById('g-blocked').textContent = stats.blocked.toLocaleString();
  const allowedPct = stats.total > 0 ? (stats.allowed/stats.total*100).toFixed(1) : '100';
  const blockedPct = stats.total > 0 ? (stats.blocked/stats.total*100).toFixed(1) : '0';
  document.getElementById('g-allowed-pct').textContent = allowedPct+'%';
  document.getElementById('g-blocked-pct').textContent = blockedPct+'%';

  // Live feed
  const feed = document.getElementById('live-feed');
  document.getElementById('feed-count').textContent = events.length + ' events';
  if (events.length === 0) {
    feed.innerHTML = '<div class="empty">Waiting for events...</div>';
  } else {
    feed.innerHTML = events.slice(0, 20).map((ev, i) => `
      <div class="entry ${ev.verdict === 'block' ? 'blocked' : 'allowed'}">
        <div class="ts">${new Date(ev.timestamp*1000).toLocaleTimeString()}</div>
        <div class="prompt">${esc(ev.prompt || '(no prompt)')}</div>
        <div class="tags">
          <span class="tag ${ev.verdict === 'block' ? 'red' : 'green'}">${ev.verdict.toUpperCase()}</span>
          ${(ev.categories||[]).map((c,i) => `<span class="tag">${c}</span>`).join('')}
          <span style="font-size:0.6rem;color:var(--muted)">${(ev.latency_ms||0).toFixed(2)}ms</span>
        </div>
      </div>
    `).join('');
  }

  // Category chart
  const catDiv = document.getElementById('category-chart');
  const catEntries = Object.entries(categories).sort((a,b) => b[1]-a[1]);
  if (catEntries.length === 0) {
    catDiv.innerHTML = '<div class="empty">No detections yet</div>';
  } else {
    const maxVal = Math.max(...catEntries.map(e=>e[1]), 1);
    catDiv.innerHTML = catEntries.map(([name, count], i) => `
      <div class="bar-row">
        <div class="bar-label">${name}</div>
        <div class="bar-track">
          <div class="bar-fill ${CAT_COLORS[i%CAT_COLORS.length]}" style="width:${(count/maxVal*100).toFixed(0)}%">${count}</div>
        </div>
      </div>
    `).join('');
  }
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').substring(0, 80); }

// Poll REST API for stats as fallback
async function pollStats() {
  try {
    const r = await fetch('/stats');
    const d = await r.json();
    stats.total = d.total_checked || stats.total;
    stats.allowed = d.total_allowed || stats.allowed;
    stats.blocked = d.total_blocked || stats.blocked;
    stats.latency = d.avg_latency_ms || stats.latency;
    if (d.detections_by_category) categories = {...categories, ...d.detections_by_category};
    render();
  } catch(e) {}
}

connect();
setInterval(pollStats, 3000);
render();
</script>
</body>
</html>
